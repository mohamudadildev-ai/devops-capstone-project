[nosetests]
verbosity = 2
with-spec = 1
spec-color = 1
with-coverage = 1
cover-erase = 1
cover-package = service
cover-branches = 1

[coverage:run]
source = service
omit = service/__init__.py

[coverage:report]
show_missing = True

[flake8]
max-line-length = 127
exclude = .git,__pycache__,.venv,venv,migrations,build,dist
ignore = E203,W503

[pylint]
max-line-length = 127
disable = too-few-public-methods,missing-module-docstring,duplicate-code
